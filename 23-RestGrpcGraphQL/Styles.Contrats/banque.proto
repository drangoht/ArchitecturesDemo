// Le contrat gRPC de la banque. C'est LUI la source de vérité : en vrai, protoc génère à partir de ce fichier le code
// du serveur et celui des clients, dans chaque langage. Ici, Messages.cs est écrit à la main, et un test vérifie
// qu'il correspond champ par champ (nom, numéro, type).
syntax = "proto3";

package banque;

service Banque {
  // L'écran d'accueil d'un client en un seul appel : ses comptes et leurs dernières opérations.
  rpc ObtenirTableauDeBord (DemandeTableauDeBord) returns (TableauDeBord);
  rpc ObtenirCompte (DemandeCompte) returns (Compte);
  rpc EffectuerVirement (DemandeVirement) returns (Virement);
  // Flux serveur : chaque nouvelle opération du compte, dès qu'elle a lieu, tant que le client écoute.
  rpc SuivreOperations (DemandeSuivi) returns (stream Operation);
}

enum TypeCompte {
  TYPE_COMPTE_INCONNU = 0;  // proto3 : la valeur 0 est celle par défaut, et celle que lit un client trop ancien
  COURANT = 1;
  EPARGNE = 2;
}

message DemandeTableauDeBord {
  string client_id = 1;
  int32 operations_par_compte = 2;
}

message TableauDeBord {
  string client_id = 1;
  string nom = 2;
  repeated Compte comptes = 3;
}

message DemandeCompte {
  string numero = 1;
}

// Pas de type décimal en Protobuf : les montants circulent en centimes, sur des entiers.
message Compte {
  string numero = 1;
  string libelle = 2;
  TypeCompte type = 3;
  int64 solde_centimes = 4;
  repeated Operation dernieres_operations = 5;
}

message Operation {
  string id = 1;
  int64 date_unix_ms = 2;
  string libelle = 3;
  sint64 montant_centimes = 4;  // sint64 (zigzag) : les débits sont négatifs
}

message DemandeVirement {
  string source = 1;
  string cible = 2;
  int64 montant_centimes = 3;
  string libelle = 4;
}

message Virement {
  string id = 1;
  string source = 2;
  string cible = 3;
  int64 montant_centimes = 4;
  int64 solde_source_centimes = 5;
}

message DemandeSuivi {
  string numero = 1;
}
